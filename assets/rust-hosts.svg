<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Rust Hosts — two switches: enabled and disabled</title>
  <!-- azulejo arredondado -->
  <rect x="16" y="16" width="224" height="224" rx="40" fill="#2C3566"/>

  <!-- entrada habilitada: trilho gordo, botão azul à direita e dentro do trilho -->
  <rect x="48" y="56" width="160" height="64" rx="32" fill="#E8EAFE"/>
  <circle cx="176" cy="88" r="26" fill="#5865F2"/>

  <!-- entrada desabilitada: botão à esquerda, cores apagadas -->
  <rect x="48" y="136" width="160" height="64" rx="32" fill="#66739F"/>
  <circle cx="80" cy="168" r="26" fill="#A9B2D1"/>
</svg>
